  <!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Sport Cars v2 - Spoiler & Zakręty</title>
<style>body{margin:0;overflow:hidden;background:#111;font-family:sans-serif}#hud{position:absolute;top:10px;left:10px;color:white;background:rgba(0,0,0,0.6);padding:10px 15px;border-radius:10px;line-height:1.4}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">Prędkość: <b id="speed" style="color:#00ff88">0</b> km/h<br>Zakręt: <span id="curve">prosta</span></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x1a1a1a,40,250);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(30,50,20);scene.add(light);

// Auto ze spojlerem
function createSportCar(color, hasSpoiler=true){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(4,1.2,8),new THREE.MeshStandardMaterial({color, metalness:0.6, roughness:0.3}));
  body.position.y=1;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.9,2.8),new THREE.MeshStandardMaterial({color:0x0a0a0a}));
  cabin.position.set(0,1.8,-0.3);g.add(cabin);
  if(hasSpoiler){
    // SPOJLER
    const wing=new THREE.Mesh(new THREE.BoxGeometry(4.5,0.2,1),new THREE.MeshStandardMaterial({color:0x111111}));
    wing.position.set(0,1.6,-4.2);g.add(wing);
    const leg1=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.8,0.3),new THREE.MeshStandardMaterial({color:0x111111}));
    leg1.position.set(-1.5,1.2,-4);g.add(leg1);
    const leg2=leg1.clone();leg2.position.x=1.5;g.add(leg2);
  }
  // koła
  const wheelGeo=new THREE.CylinderGeometry(0.7,0.7,0.5,12);
  const wheelMat=new THREE.MeshStandardMaterial({color:0x111111});
  [[-2,0,2.5],[2,0,2.5],[-2,0,-2.5],[2,0,-2.5]].forEach(p=>{
    const w=new THREE.Mesh(wheelGeo,wheelMat);w.rotation.z=Math.PI/2;w.position.set(p[0],0.6,p[1]);g.add(w);
  });
  return g;
}

const player=createSportCar(0x00ff88,true);scene.add(player);

// Droga z zakrętami - 200 segmentów
const roadGroup=new THREE.Group();scene.add(roadGroup);
const roadSegments=[];
for(let i=0;i<200;i++){
  const seg=new THREE.Mesh(new THREE.PlaneGeometry(30,12),new THREE.MeshStandardMaterial({color:i%2==0?0x222222:0x2a2a2a}));
  seg.rotation.x=-Math.PI/2;seg.position.z=-i*12;seg.position.y=0.01;
  roadGroup.add(seg);roadSegments.push(seg);
  if(i%4==0){
    const line=new THREE.Mesh(new THREE.PlaneGeometry(0.8,6),new THREE.MeshStandardMaterial({color:0xffffff}));
    line.rotation.x=-Math.PI/2;line.position.set(0,0.05,-i*12);roadGroup.add(line);
  }
}

let distance=0,speed=0,steering=0;
const keys={};onkeydown=e=>keys[e.code]=true;onkeyup=e=>keys[e.code]=false;

// ruch drogą z zakrętami
function getCurve(z){
  // sinusoida = zakręty
  return Math.sin(z*0.02)*12 + Math.sin(z*0.008)*8;
}

const traffic=[];
for(let i=0;i<10;i++){
  const c=createSportCar(Math.random()>0.5?0xff0040:0x0088ff,true);
  c.position.z=-80-Math.random()*1500;c.userData.speed=0.4+Math.random()*0.5;
  traffic.push(c);scene.add(c);
}

camera.position.set(0,7,14);
function animate(){
  requestAnimationFrame(animate);
  if(keys['KeyW'])speed=Math.min(speed+0.025,1.5);
  if(keys['KeyS'])speed=Math.max(speed-0.05,-0.4);
  if(!keys['KeyW']&&!keys['KeyS'])speed*=0.985;
  if(keys['KeyA'])steering=Math.min(steering+0.05,1);
  if(keys['KeyD'])steering=Math.max(steering-0.05,-1);
  if(!keys['KeyA']&&!keys['KeyD'])steering*=0.88;
  if(keys['Space']){steering*=1.08;speed*=0.992;}

  distance+=speed*2;
  const curveNow=getCurve(distance);
  
  // przesuń drogę
  roadSegments.forEach(seg=>{
    const baseZ=seg.userData.baseZ||seg.position.z;
    if(!seg.userData.baseZ)seg.userData.baseZ=seg.position.z;
    let nz=seg.userData.baseZ+distance;
    while(nz>20){seg.userData.baseZ-=2400;nz=seg.userData.baseZ+distance;}
    while(nz<-2400){seg.userData.baseZ+=2400;nz=seg.userData.baseZ+distance;}
    seg.position.z=nz;
    seg.position.x=getCurve(distance - nz);
  });

  // gracz skręca + siła odśrodkowa zakrętu
  const roadCurveForce=(getCurve(distance+20)-getCurve(distance))*0.15;
  player.position.x-=steering*speed*1.8 + roadCurveForce*speed;
  player.position.x=Math.max(-12+curveNow,-12+curveNow+24); // ograniczenie drogi
  // jeśli wypadniesz
  if(Math.abs(player.position.x - curveNow)>12){speed*=0.9;document.getElementById('curve').textContent="POBOCZE!";}
  else {
    if(Math.abs(roadCurveForce)>0.8)document.getElementById('curve').textContent=roadCurveForce>0?"LEWY ZAKRĘT":"PRAWY ZAKRĘT";
    else document.getElementById('curve').textContent="prosta";
  }
  player.rotation.y=steering*0.6 + roadCurveForce*0.2;
  player.rotation.z=-steering*0.3; // przechył w zakręcie

  traffic.forEach(c=>{
    c.position.z+=speed*2-c.userData.speed;
    c.position.x=getCurve(distance - c.position.z)+(Math.random()-0.5)*8;
    if(c.position.z>20){c.position.z=-1500-Math.random()*500;}
  });

  camera.position.x+= (player.position.x - camera.position.x)*0.12;
  camera.position.z=14;
  camera.lookAt(player.position.x,0,player.position.z-25);

  document.getElementById('speed').textContent=Math.round(speed*220);
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
